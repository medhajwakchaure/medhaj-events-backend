name: Backend CI

on:
    push:
        branches: [ develop, main, feature/**, bugfix/**, hotfix/**, release/** ]
    pull_request:
        branches: [ develop, main ]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Java
              uses: actions/setup-java@v4
              with:
                  java-version: '17'
                  distribution: 'temurin'
                  cache: 'maven'

            # Clean & build while skipping test *compilation* and execution
            - name: Build (skip tests completely)
              run: mvn -B -Dmaven.test.skip=true clean package
